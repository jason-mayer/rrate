name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: pages
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        id: run-tests
        run: flutter test --coverage --branch-coverage

      - name: Compile for web
        run: flutter build web --release --base-href /rrate/ --no-web-resources-cdn -O4 --csp --wasm

      - name: Zip `build/web` folder
        run: |
          cd build/web
          zip ../../web.zip * -r

      - name: Attach `web.zip` as artifact
        uses: actions/upload-artifact@v7
        with:
          path: web.zip
          archive: false

      - name: Upload `web.zip` to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            web.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
